name: daily-price-update

on:
  schedule:
    - cron: "0 2 * * *"      # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # 显式指定 Node 22 LTS，消除 Node 20 弃用警告
          
      - run: node scripts/update-prices.mjs
      
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          # 只有文件发生实际改变时才提交
          git diff --cached --quiet || { git commit -m "chore: daily price update"; git push; }